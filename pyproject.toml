[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-hook-plugins"
version = "0.2.0"
description = "Plugin library for vLLM: introspection, analysis, and per-request activation steering."
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.9"
dependencies = [
    "vllm>=0.5",
    "torch>=2.0",
    "numpy>=1.24",
    "zstandard>=0.22",
    "pydantic>=2.0",
]

[project.entry-points."vllm.general_plugins"]
hook_registry = "vllm_hook_plugins:register_plugins"

[tool.setuptools.packages.find]
where = ["vllm_hook_plugins"]
include = ["vllm_hook_plugins*"]
